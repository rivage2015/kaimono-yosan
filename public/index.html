<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#176957"><title>買い物予算メモ</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main><header><h1>買い物予算メモ</h1><p>税込価格を入れて、追加するだけ。</p></header>
<section class="summary" aria-label="買い物の合計"><span>合計</span><strong id="total">0円</strong><p id="remaining">残予算 3,000円</p><button id="budget-open" class="quiet">予算 <span id="budget-label">3,000円</span> · 変更</button></section>
<p id="storage-status" class="status" role="status"></p><p id="offline-status" class="status" role="status">オフライン準備中…</p>
<form id="add-form"><label for="price">税込価格（円）</label><input id="price" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="例：198" required><button type="button" id="input-toggle" class="input-toggle">大きなテンキーを開く</button><div id="keypad" class="keypad" hidden aria-label="金額の大きなテンキー"><div class="keypad-top"><strong>金額を入力</strong><button type="button" id="keypad-close">閉じる</button></div><div class="keypad-grid"><button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button><button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button><button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button><button type="button" id="keypad-backspace" aria-label="1文字消す">⌫</button><button type="button" data-digit="0">0</button><button type="button" id="keypad-done">確定</button></div><button type="button" id="keyboard-switch" class="quiet">標準キーボードに切替</button></div><p id="input-help" class="input-help">端末のキーボードも使えます。</p><div class="quantity"><span>数量</span><button type="button" id="minus" aria-label="数量を減らす">−</button><output id="quantity">1</output><button type="button" id="plus" aria-label="数量を増やす">＋</button></div><label for="name">商品名 <span class="optional">任意</span></label><input id="name" maxlength="80" placeholder="空欄でも追加できます"><p id="form-error" class="error" role="alert"></p><button class="primary" type="submit">追加する</button></form>
<section class="items"><h2>買い物リスト <span id="count">0件</span></h2><p id="empty">まだ商品はありません。</p><ul id="list"></ul></section><div id="undo-box" hidden role="status">削除しました。<button id="undo">取り消す</button></div><footer><button id="finish" class="quiet">買い物を終了する</button><p>履歴は残しません。現在の内容はこの端末だけに保存します。</p></footer>
</main><dialog id="editor"><form id="edit-form"><h2>商品を編集</h2><label for="edit-name">商品名（任意）</label><input id="edit-name" maxlength="80"><label for="edit-price">税込価格（円）</label><input id="edit-price" inputmode="numeric" required><label for="edit-quantity">数量</label><input id="edit-quantity" inputmode="numeric" required><p id="edit-error" class="error" role="alert"></p><button class="primary">保存する</button><button type="button" class="quiet" data-close="editor">キャンセル</button></form></dialog>
<dialog id="budget-dialog"><form id="budget-form"><h2>予算を変更</h2><label for="budget-input">予算（円）</label><input id="budget-input" inputmode="numeric" required><p id="budget-error" class="error" role="alert"></p><button class="primary">保存する</button><button type="button" class="quiet" data-close="budget-dialog">キャンセル</button></form></dialog>
<dialog id="finish-dialog"><h2>買い物を終了しますか？</h2><p>品目をすべて消します。予算は次の買い物にも引き継ぎます。</p><button id="finish-confirm" class="primary">終了して品目を消す</button><button class="quiet" data-close="finish-dialog">キャンセル</button></dialog></body></html>
